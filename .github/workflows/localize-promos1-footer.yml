name: Localize PROMOS1 footer and language buttons
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update-language-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep PROMOS1 WhatsApp localized and show full language names
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()

          # Make the two language controls explicit and user-friendly.
          s=s.replace('<button id="langEN" class="active" type="button">EN</button>', '<button id="langEN" class="active" type="button" aria-label="Switch to English">English</button>')
          s=s.replace('<button id="langES" type="button">ES</button>', '<button id="langES" type="button" aria-label="Cambiar a Español">Español</button>')

          # Keep the PROMOS1 WhatsApp message synchronized with the selected language.
          s=re.sub(r'href="https://wa\.me/17183505194(?:\?text=[^"]*)?" data-whatsapp="promos1"', 'href="https://wa.me/17183505194" data-whatsapp="promos1"', s)
          marker='data-promos-wa-language'
          if marker not in s:
              script='''<script data-promos-wa-language>(()=>{const link=document.querySelector('a[data-whatsapp="promos1"]');if(!link)return;const en='Hello PROMOS1. I’m interested in developing a similar app or website. Please contact me with more information. Thank you.';const es='Hola PROMOS1. Estoy interesado en desarrollar una aplicación o website similar. Favor de contactarme para recibir más información. Gracias.';function updatePromosWA(){link.href='https://wa.me/17183505194?text='+encodeURIComponent(lang==='es'?es:en)}const originalSetLanguage=setLanguage;setLanguage=function(l){originalSetLanguage(l);updatePromosWA()};updatePromosWA()})();</script>'''
              s=s.replace('</body>',script+'</body>')
          p.write_text(s)
          PY
      - name: Commit update
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Show English and Español language buttons"
          git push
