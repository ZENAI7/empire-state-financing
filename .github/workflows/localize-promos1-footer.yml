name: Localize PROMOS1 footer
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update-footer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update bilingual footer and WhatsApp link
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.parse import quote
          p=Path('index.html')
          s=p.read_text()
          msg='Hola PROMOS1. Estoy interesado en desarrollar una aplicación o website similar. Favor de contactarme para recibir más información. Gracias.'
          wa='https://wa.me/17183505194?text='+quote(msg, safe='')
          old='href="https://wa.me/17183505194"'
          s=s.replace(old, f'href="{wa}" data-whatsapp="promos1"')
          s=s.replace("if(!href||href.startsWith('#')||href.startsWith('mailto:')||href.startsWith('tel:'))return;", "if(!href||href.startsWith('#')||href.startsWith('mailto:')||href.startsWith('tel:')||a.dataset.whatsapp==='promos1'||href.includes('wa.me/'))return;")
          p.write_text(s)
          PY
      - name: Commit update
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix PROMOS1 WhatsApp contact message"
          git push
